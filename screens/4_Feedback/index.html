<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#063ff9",
                        "background-light": "#F9F9F9",
                        "text-dark": "#111111",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0px",
                        "lg": "0px",
                        "xl": "0px",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Space Grotesk', sans-serif;
        }
        .premium-input {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            transition: border-color 0.2s ease;
        }
        .premium-input:focus {
            border-color: #063ff9;
            outline: none;
            ring: 0;
        }
    </style>
</head>
<body class="bg-background-light text-text-dark font-display selection:bg-primary selection:text-white">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<!-- Header -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-black/5 px-6 md:px-20 py-6">
<div class="flex items-center gap-4 text-text-dark">
<div class="size-6 text-primary">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M24 4H6V17.3333V30.6667H24V44H42V30.6667V17.3333H24V4Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
</div>
<h2 class="text-text-dark text-xl font-bold leading-tight tracking-tighter uppercase">ResumeHub.in</h2>
</div>
<div class="flex flex-1 justify-end gap-10">
<nav class="hidden md:flex items-center gap-10">
<a class="text-slate-500 hover:text-primary text-xs font-bold uppercase tracking-widest transition-colors" href="#">Home</a>
<a class="text-slate-500 hover:text-primary text-xs font-bold uppercase tracking-widest transition-colors" href="#">Resumes</a>
<a class="text-slate-500 hover:text-primary text-xs font-bold uppercase tracking-widest transition-colors" href="#">Templates</a>
</nav>
<button class="flex cursor-pointer items-center justify-center border border-black/10 bg-transparent hover:bg-black/5 text-text-dark p-2 transition-all">
<span class="material-symbols-outlined text-[20px]">dark_mode</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex flex-1 justify-center py-12 md:py-24 px-6">
<div class="layout-content-container flex flex-col max-w-[800px] flex-1">
<!-- Page Title -->
<div class="flex flex-col gap-4 mb-16">
<span class="text-primary text-xs font-bold uppercase tracking-[0.3em]">Client Relations</span>
<h1 class="text-text-dark text-6xl md:text-8xl font-black leading-none tracking-tighter uppercase">Feedback</h1>
<p class="text-slate-600 text-lg font-light max-w-md border-l-2 border-primary pl-6 mt-4">
                            We pursue absolute perfection. Tell us how we can refine the ResumeHub experience to better serve your professional identity.
                        </p>
</div>
<!-- Feedback Form -->
<form class="flex flex-col gap-8">
<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
<div class="flex flex-col gap-2">
<label class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Full Name</label>
<input class="premium-input h-16 px-5 text-text-dark placeholder:text-slate-300 font-medium" placeholder="JOHN DOE" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Email Address</label>
<input class="premium-input h-16 px-5 text-text-dark placeholder:text-slate-300 font-medium" placeholder="PARTNER@HUB.IN" type="email"/>
</div>
</div>
<div class="flex flex-col gap-4">
<label class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Experience Rating</label>
<div class="flex gap-4">
<button class="group flex flex-1 flex-col items-center justify-center border border-black/10 bg-white py-6 hover:border-primary transition-all" type="button">
<span class="text-slate-300 group-hover:text-primary font-bold text-2xl">01</span>
<span class="text-[8px] uppercase tracking-tighter text-slate-400">Poor</span>
</button>
<button class="group flex flex-1 flex-col items-center justify-center border border-black/10 bg-white py-6 hover:border-primary transition-all" type="button">
<span class="text-slate-300 group-hover:text-primary font-bold text-2xl">02</span>
<span class="text-[8px] uppercase tracking-tighter text-slate-400">Fair</span>
</button>
<button class="group flex flex-1 flex-col items-center justify-center border border-black/10 bg-white py-6 hover:border-primary transition-all" type="button">
<span class="text-slate-300 group-hover:text-primary font-bold text-2xl">03</span>
<span class="text-[8px] uppercase tracking-tighter text-slate-400">Good</span>
</button>
<button class="group flex flex-1 flex-col items-center justify-center border border-primary bg-primary/5 py-6" type="button">
<span class="text-primary font-bold text-2xl">04</span>
<span class="text-[8px] uppercase tracking-tighter text-primary">Elite</span>
</button>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Detailed Critique</label>
<textarea class="premium-input min-h-[200px] p-5 text-text-dark placeholder:text-slate-300 font-medium resize-none" placeholder="YOUR THOUGHTS ON OUR SYSTEM ARCHITECTURE..."></textarea>
</div>
<div class="mt-8">
<button class="group relative w-full h-24 bg-primary hover:bg-blue-700 transition-all flex items-center justify-center overflow-hidden" type="submit">
<span class="relative z-10 text-white text-2xl md:text-3xl font-black uppercase tracking-[0.2em]">Submit Feedback</span>
<div class="absolute inset-0 bg-white/10 translate-x-[-100%] group-hover:translate-x-0 transition-transform duration-500"></div>
</button>
</div>
</form>
<!-- Footer Info -->
<div class="mt-24 pt-12 border-t border-black/5 flex flex-col md:flex-row justify-between items-start md:items-center gap-8">
<div class="flex items-center gap-6">
<span class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">HQ: LONDON / NYC / SYD</span>
<span class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">EST 2024</span>
</div>
<div class="flex gap-8">
<a class="text-slate-400 hover:text-text-dark text-[10px] font-bold uppercase tracking-widest transition-colors" href="#">Privacy Protocol</a>
<a class="text-slate-400 hover:text-text-dark text-[10px] font-bold uppercase tracking-widest transition-colors" href="#">Terms of Service</a>
</div>
</div>
</div>
</main>
</div>
</div>
</body></html>
